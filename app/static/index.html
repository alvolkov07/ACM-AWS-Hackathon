<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agri-Supply</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6ee;
  --panel:#ffffff;
  --ink:#1f2a1c;
  --ink-soft:#5c6b55;
  --line:#e2e9d8;
  --green:#3c7a3f;
  --green-deep:#2c5e30;
  --green-700:#255228;
  --leaf:#6fae5a;
  --wheat:#d8a13a;
  --wheat-soft:#f3e4c4;
  --mint:#e9f1e0;
  --mint-2:#dfecd2;
  --danger:#b4452e;
  --shadow:0 1px 2px rgba(31,42,28,.06),0 8px 24px rgba(31,42,28,.08);
  --radius:16px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:"Inter",system-ui,sans-serif;color:var(--ink);
  background:
    radial-gradient(1200px 600px at 110% -10%, #e7f0dc 0%, transparent 55%),
    radial-gradient(900px 500px at -10% 110%, #eef4e4 0%, transparent 50%),
    var(--bg);
}
h1,h2,h3,h4{font-family:"Fraunces",Georgia,serif;letter-spacing:-.01em;margin:0}
a{color:inherit}
button{font:inherit}
.hidden{display:none!important}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:300px 1fr;min-height:100vh}

/* ---------- sidebar ---------- */
.sidebar{
  background:linear-gradient(180deg,var(--green-deep),var(--green-700));
  color:#eaf3e2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:22px 20px 16px}
.brand .logo{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(145deg,var(--leaf),#4f9a44);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);
}
.brand b{font-family:"Fraunces",serif;font-size:19px;font-weight:600;color:#fff}
.brand small{display:block;color:#bcd6ab;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-family:"Inter"}

.side-head{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 6px}
.side-head span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#a9ca97}
.new-btn{
  background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18);
  border-radius:9px;padding:5px 10px;font-size:12px;cursor:pointer;transition:.15s;
}
.new-btn:hover{background:rgba(255,255,255,.22)}

.flows{flex:1;overflow-y:auto;padding:6px 12px 12px;display:flex;flex-direction:column;gap:6px}
.flow{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);border-radius:12px;
  overflow:hidden;transition:.15s;
}
.flow:hover{background:rgba(255,255,255,.11)}
.flow.active{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.25)}
.flow-top{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.flow-dot{width:8px;height:8px;border-radius:50%;background:var(--leaf);flex:none;box-shadow:0 0 0 3px rgba(111,174,90,.25)}
.flow-title{flex:1;font-size:13.5px;font-weight:600;color:#f3f8ee;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flow-caret{font-size:10px;color:#bcd6ab;transition:transform .2s}
.flow.open .flow-caret{transform:rotate(90deg)}
.flow-body{display:none;padding:0 12px 11px;animation:drop .18s ease}
.flow.open .flow-body{display:block}
@keyframes drop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.flow-body .svc{font-size:11px;color:#c7deb8;margin-bottom:8px}
.flow-body .svc b{color:#fff;font-weight:600}
.mini-steps{display:flex;gap:6px;margin-bottom:9px}
.mini-steps .s{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.14)}
.mini-steps .s.on{background:var(--wheat)}
.flow-open-btn{
  width:100%;background:#fff;color:var(--green-deep);border:0;border-radius:8px;padding:7px;
  font-size:12px;font-weight:600;cursor:pointer;transition:.15s;
}
.flow-open-btn:hover{background:var(--mint-2)}
.flows-empty{color:#a9ca97;font-size:12.5px;padding:14px 12px;text-align:center;line-height:1.5}

.side-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--wheat);color:#4a3307;display:grid;place-items:center;font-weight:700;font-family:"Fraunces"}
.side-foot .u{flex:1;min-width:0}
.side-foot .u b{display:block;font-size:13px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:"Inter"}
.side-foot .u small{color:#bcd6ab;font-size:11px}
.logout{background:none;border:0;color:#cfe3c1;cursor:pointer;font-size:12px}
.logout:hover{color:#fff;text-decoration:underline}

/* ---------- main ---------- */
.content{overflow-y:auto;height:100vh}
.inner{max-width:900px;margin:0 auto;padding:34px 30px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.topbar .hi small{color:var(--ink-soft);font-size:13px;letter-spacing:.04em}
.topbar .hi h1{font-size:30px;font-weight:600;margin-top:2px}
.topbar .hi h1 .wave{color:var(--wheat)}
.season-tag{
  background:var(--wheat-soft);color:#6b4e12;border:1px solid #e9d4a3;border-radius:999px;
  padding:7px 14px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px;
}

/* hero prompt */
.hero{
  background:linear-gradient(135deg,#fff,#f7faf1);border:1px solid var(--line);border-radius:22px;
  padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.hero::after{content:"🌱";position:absolute;right:-6px;bottom:-14px;font-size:120px;opacity:.06;transform:rotate(-8deg)}
.hero h3{font-size:18px;font-weight:600}
.hero p{color:var(--ink-soft);font-size:13.5px;margin:4px 0 14px}
.input-wrap{display:flex;gap:10px;align-items:flex-end;position:relative;z-index:1}
.input-wrap textarea{
  flex:1;border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;font:inherit;resize:none;
  background:#fff;transition:.15s;color:var(--ink);
}
.input-wrap textarea:focus{outline:none;border-color:var(--leaf);box-shadow:0 0 0 4px rgba(111,174,90,.15)}
.chips{margin-top:12px;display:flex;flex-wrap:wrap;gap:7px}
.chip{
  background:var(--mint);border:1px solid var(--line);color:var(--green-deep);border-radius:999px;
  padding:6px 12px;font-size:12px;cursor:pointer;transition:.15s;
}
.chip:hover{background:var(--mint-2);transform:translateY(-1px)}

/* buttons */
.btn{
  background:var(--green);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:600;
  cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px;font-size:14px;
}
.btn:hover{background:var(--green-deep);transform:translateY(-1px);box-shadow:0 6px 16px rgba(44,94,48,.25)}
.btn:active{transform:none}
.btn.ghost{background:#fff;color:var(--green-deep);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--mint);box-shadow:none}
.btn.wheat{background:var(--wheat);color:#4a3307}
.btn.wheat:hover{background:#c9922f;box-shadow:0 6px 16px rgba(216,161,58,.3)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:9px}

/* cards & sections */
.section-label{display:flex;align-items:center;gap:10px;margin:30px 0 12px}
.section-label .n{
  width:26px;height:26px;border-radius:8px;background:var(--green);color:#fff;display:grid;place-items:center;
  font-size:13px;font-weight:700;font-family:"Fraunces";flex:none;
}
.section-label h3{font-size:16px;font-weight:600}
.section-label small{color:var(--ink-soft);font-size:12.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.muted{color:var(--ink-soft);font-size:13px}

.wf-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:4px}
.wf-card{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;cursor:pointer;
  transition:.15s;box-shadow:var(--shadow);position:relative;
}
.wf-card:hover{transform:translateY(-3px);border-color:var(--leaf)}
.wf-card .tag{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--wheat);font-weight:700}
.wf-card h4{font-size:15px;font-weight:600;margin:5px 0 6px;line-height:1.3}
.wf-card .meta{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.svc-pill{display:inline-block;background:var(--mint);color:var(--green-deep);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:600}

/* companies */
.company{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.company:first-of-type{border-top:0}
.company input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);flex:none}
.company .cinfo{flex:1}
.company .cinfo b{font-size:14px}
.company .cinfo small{display:block;color:var(--ink-soft);font-size:12px;margin-top:2px}
.stars{color:var(--wheat);font-size:13px;font-weight:700;background:var(--wheat-soft);padding:3px 9px;border-radius:999px;white-space:nowrap}

/* emails */
.email{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;background:#fcfdfa}
.email:first-child{margin-top:0}
.email .ehead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.email .ehead b{font-size:14px}
.email .ehead small{color:var(--ink-soft)}
.status{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--mint-2);color:var(--green-deep)}
.status.sent{background:#d9efd9;color:#226b2a}
.status.draft{background:var(--wheat-soft);color:#6b4e12}
.field-lbl{font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin:8px 0 3px}
.email input,.email textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;background:#fff}
.email input:focus,.email textarea:focus{outline:none;border-color:var(--leaf);box-shadow:0 0 0 3px rgba(111,174,90,.12)}
.email textarea{resize:vertical}
.email .erow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-height:380px;overflow-y:auto;margin-bottom:12px;padding-right:4px}
.msg{padding:11px 14px;border-radius:14px;max-width:84%;font-size:14px;line-height:1.5;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--mint);color:var(--ink);border-bottom-left-radius:4px}
.msg.bot.pending{opacity:.6}
.chat-input{display:flex;gap:8px}
.chat-input input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;background:#fff}
.chat-input input:focus{outline:none;border-color:var(--leaf);box-shadow:0 0 0 4px rgba(111,174,90,.15)}
.chat-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}

.back{display:inline-flex;align-items:center;gap:6px;color:var(--green-deep);font-size:13px;font-weight:600;text-decoration:none;margin-bottom:16px;cursor:pointer}
.back:hover{text-decoration:underline}

/* ---------- auth screen ---------- */
.auth-screen{
  min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;
}
.auth-art{
  background:linear-gradient(160deg,var(--green-deep),var(--green-700));color:#eaf3e2;
  padding:56px 50px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;
}
.auth-art::after{content:"🌾";position:absolute;right:-20px;bottom:-30px;font-size:260px;opacity:.08}
.auth-art .brand b{font-size:22px}
.auth-art h2{font-size:40px;font-weight:600;line-height:1.1;margin-top:40px;color:#fff;max-width:420px}
.auth-art p{color:#c7deb8;font-size:15px;line-height:1.6;margin-top:16px;max-width:380px}
.auth-art .feats{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.auth-art .feat{display:flex;gap:11px;align-items:center;font-size:14px;color:#dcecd0}
.auth-art .feat .ic{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.auth-panel{display:flex;align-items:center;justify-content:center;padding:40px}
.auth-box{width:100%;max-width:380px}
.auth-box h3{font-size:24px;font-weight:600}
.auth-box .sub{color:var(--ink-soft);font-size:14px;margin:6px 0 22px}
.auth-box label{font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin:12px 0 4px}
.auth-box input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px 13px;font:inherit;background:#fff}
.auth-box input:focus{outline:none;border-color:var(--leaf);box-shadow:0 0 0 4px rgba(111,174,90,.15)}
.auth-box .btn{width:100%;justify-content:center;margin-top:20px}
.auth-tabs{display:flex;background:var(--mint);border-radius:12px;padding:4px;margin-bottom:22px}
.auth-tabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:600;color:var(--ink-soft);cursor:pointer;font-size:13.5px}
.auth-tabs button.active{background:#fff;color:var(--green-deep);box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:50;
  opacity:0;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.25);pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger)}

@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:relative;height:auto}
  .flows{max-height:240px}
  .content{height:auto}
  .auth-screen{grid-template-columns:1fr}
  .auth-art{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast"></div>

<script>
let token = localStorage.token || "", me = null, wid = null, openFlows = {};
const $ = s => document.querySelector(s);
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials = n => (n||"?").trim().slice(0,2).toUpperCase();

function toast(msg, isErr){
  const t = $("#toast"); t.textContent = msg; t.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = "toast", 2600);
}

async function api(path, method = "GET", body){
  const r = await fetch("/api" + path, {
    method, headers:{"Content-Type":"application/json", Authorization:"Bearer " + token},
    body: body ? JSON.stringify(body) : undefined
  });
  if(r.status === 401){
    localStorage.removeItem("token"); token = ""; me = null;
    authView();
    throw new Error("Your session expired. Please log in again.");
  }
  if(!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.detail || r.statusText); }
  return r.json();
}
const run = fn => async (...a) => { try { await fn(...a); } catch(e){ toast(e.message, true); } };

/* ================= AUTH ================= */
function authView(){
  document.body.classList.remove("has-app");
  $("#root").innerHTML = `
  <div class="auth-screen">
    <div class="auth-art">
      <div class="brand"><div class="logo">🌾</div><div><b>Agri-Supply</b><small>Procurement, grown simple</small></div></div>
      <div>
        <h2>Source farm supplies without the back-and-forth.</h2>
        <p>Describe what your farm needs. We match you with rated suppliers, draft the outreach emails, and help you compare every reply.</p>
        <div class="feats">
          <div class="feat"><div class="ic">🔎</div> Smart supplier matching by service</div>
          <div class="feat"><div class="ic">✉️</div> AI-drafted quote request emails</div>
          <div class="feat"><div class="ic">📊</div> Compare replies &amp; get a recommendation</div>
        </div>
      </div>
      <small style="color:#a9ca97">Harvest season · 2026</small>
    </div>
    <div class="auth-panel">
      <div class="auth-box">
        <div class="auth-tabs">
          <button id="tabLogin" class="active" onclick="switchTab('login')">Log in</button>
          <button id="tabReg" onclick="switchTab('reg')">Create account</button>
        </div>
        <div id="loginForm">
          <h3>Welcome back 🌱</h3>
          <p class="sub">Log in to pick up your supplier workflows.</p>
          <label>Username</label><input id="u" placeholder="your username">
          <label>Password</label><input id="p" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
          <button class="btn" onclick="login()">Log in →</button>
        </div>
        <div id="regForm" class="hidden">
          <h3>Grow with us</h3>
          <p class="sub">Set up your farm profile to get tailored outreach.</p>
          <div class="grid2">
            <div><label>Username</label><input id="ru" placeholder="username"></div>
            <div><label>Password</label><input id="rp" type="password" placeholder="••••••••"></div>
          </div>
          <label>Email</label><input id="re" placeholder="you@farm.com">
          <div class="grid2">
            <div><label>Farm name</label><input id="rf" placeholder="Green Acres"></div>
            <div><label>Location</label><input id="rl" placeholder="Fresno, CA"></div>
          </div>
          <button class="btn" onclick="register()">Create account →</button>
        </div>
      </div>
    </div>
  </div>`;
}
function switchTab(which){
  const login = which === "login";
  $("#tabLogin").classList.toggle("active", login);
  $("#tabReg").classList.toggle("active", !login);
  $("#loginForm").classList.toggle("hidden", !login);
  $("#regForm").classList.toggle("hidden", login);
}
const login = run(async () => {
  token = (await api("/login","POST",{username:$("#u").value, password:$("#p").value})).token;
  localStorage.token = token; await home();
});
const register = run(async () => {
  token = (await api("/register","POST",{
    username:$("#ru").value, password:$("#rp").value, email:$("#re").value,
    farm_name:$("#rf").value, farm_location:$("#rl").value})).token;
  localStorage.token = token; await home();
});
function logout(){ localStorage.removeItem("token"); token=""; me=null; authView(); }

/* ================= APP SHELL ================= */
async function shell(){
  me = await api("/me");
  if(!me.farm_state){
    document.body.classList.add("has-app");
    $("#root").innerHTML = `
    <div class="auth-screen"><div class="auth-panel" style="width:100%;max-width:620px">
      <div class="auth-box">
        <h3>Tell us where your farm is 📍</h3>
        <p class="sub">We use your farm location to show suppliers from the same state. Your location is converted to coordinates for matching.</p>
        <label>Farm location</label>
        <input id="locationSetup" placeholder="Fresno, CA or a farm address">
        <button class="btn" onclick="saveLocation()">Save location →</button>
      </div>
    </div></div>`;
    return null;
  }
  const wfs = await api("/workflows");
  $("#root").innerHTML = `
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="logo">🌾</div><div><b>Agri-Supply</b><small>My Work</small></div></div>
      <div class="side-head"><span>My Workflows</span><button class="new-btn" onclick="home()">+ New</button></div>
      <div class="flows" id="flows">${renderFlows(wfs)}</div>
      <div class="side-foot">
        <div class="avatar">${esc(initials(me.username))}</div>
        <div class="u"><b>${esc(me.username)}</b><small>${esc(me.farm_name || "Farm profile")}</small></div>
        <button class="logout" onclick="logout()">Log out</button>
      </div>
    </aside>
    <main class="content"><div class="inner" id="view"></div></main>
  </div>`;
  return wfs;
}
const saveLocation = run(async () => {
  await api("/me/location", "PUT", {farm_location: $("#locationSetup").value.trim()});
  await home();
});

function renderFlows(wfs){
  if(!wfs.length) return `<div class="flows-empty">🌰 No workflows yet.<br>Start one from the home page.</div>`;
  return wfs.map((w,i) => {
    const open = openFlows[w._id] ? "open" : "";
    const active = w._id === wid ? "active" : "";
    return `
    <div class="flow ${open} ${active}" id="flow-${w._id}">
      <div class="flow-top" onclick="toggleFlow('${w._id}')">
        <span class="flow-dot"></span>
        <span class="flow-title">${esc(w.title)}</span>
        <span class="flow-caret">▶</span>
      </div>
      <div class="flow-body">
        <div class="svc">Service: <b>${esc(w.service) || "no match"}</b></div>
        <div class="mini-steps"><div class="s on"></div><div class="s"></div><div class="s"></div></div>
        <button class="flow-open-btn" onclick="openWf('${w._id}')">Open workflow</button>
      </div>
    </div>`;
  }).join("");
}
function toggleFlow(id){
  openFlows[id] = !openFlows[id];
  const el = document.getElementById("flow-"+id);
  if(el) el.classList.toggle("open", !!openFlows[id]);
}
function refreshSidebar(wfs){ const f = $("#flows"); if(f) f.innerHTML = renderFlows(wfs); }

/* ================= HOME ================= */
const SAMPLE_CHIPS = [
  "We need irrigation service for 40 acres",
  "Looking to buy seeds for the spring planting",
  "Need fertilizer delivered before next month",
  "Our tractor needs equipment repair",
  "Looking for pest control for our orchard",
];
const home = run(async () => {
  wid = null;
  const wfs = await shell();
  if(!wfs) return;
  refreshSidebar(wfs);
  const hour = new Date().getHours();
  const greet = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
  $("#view").innerHTML = `
  <div class="topbar">
    <div class="hi">
      <small>${greet},</small>
      <h1>Welcome back, ${esc(me.username)} <span class="wave">👋</span></h1>
    </div>
    <div class="season-tag">🌦️ Harvest Season</div>
  </div>

  <div class="hero">
    <h3>What does your farm need today?</h3>
    <p>Describe it in plain words — we'll match you with the best-rated suppliers.</p>
    <div class="input-wrap">
      <textarea id="prompt" rows="2" placeholder="e.g. We need irrigation service for our south field…" onkeydown="if(event.key==='Enter'&&(event.metaKey||event.ctrlKey))newWf()"></textarea>
      <button class="btn" onclick="newWf()">🔎 Find suppliers</button>
    </div>
    <div class="chips">
      ${SAMPLE_CHIPS.map(c => `<span class="chip" onclick="fillPrompt(this)">${esc(c)}</span>`).join("")}
    </div>
  </div>

  <div class="section-label">
    <div class="n">⌂</div>
    <div><h3>Recent workflows</h3><small>Pick up where you left off</small></div>
  </div>
  ${wfs.length ? `<div class="wf-cards">${wfs.map(wfCard).join("")}</div>`
    : `<div class="card muted">You haven't started any workflows yet. Describe a need above to create your first one. 🌱</div>`}
  `;
});
function fillPrompt(el){ $("#prompt").value = el.textContent; $("#prompt").focus(); }
function wfCard(w){
  const date = (w.created || "").slice(0,10);
  return `<div class="wf-card" onclick="openWf('${w._id}')">
    <div class="tag">Workflow</div>
    <h4>${esc(w.title)}</h4>
    <div class="meta"><span class="svc-pill">${esc(w.service) || "no match"}</span> ${date ? "· " + date : ""}</div>
  </div>`;
}
const newWf = run(async () => {
  const p = $("#prompt").value.trim();
  if(!p) return toast("Tell us what your farm needs first 🌾", true);
  toast("Matching suppliers…");
  const d = await api("/workflows","POST",{prompt:p});
  wid = d.workflow._id; openFlows[wid] = true;
  await shell(); renderWorkflow(d);
});
const openWf = run(async id => {
  wid = id; openFlows[id] = true;
  await shell();
  renderWorkflow(await api("/workflows/" + id));
});

/* ================= WORKFLOW VIEW ================= */
function renderWorkflow(d){
  const w = d.workflow;
  $("#view").innerHTML = `
  <a class="back" onclick="home()">← Back to home</a>
  <div class="topbar">
    <div class="hi">
      <small>Workflow</small>
      <h1>${esc(w.title)}</h1>
    </div>
    <div class="season-tag">🌿 ${esc(w.service) || "no match"}</div>
  </div>
  <div class="card muted">“${esc(w.prompt)}”</div>

  <div class="section-label">
    <div class="n">1</div>
    <div><h3>Choose suppliers</h3><small>Best rated first — select who to contact</small></div>
  </div>
  <div class="card">
    ${d.companies.length ? d.companies.map(companyRow).join("") : `<div class="muted">No suppliers found for this service yet.</div>`}
    ${d.companies.length ? `
    <div class="field-lbl" style="margin-top:14px">Extra details for the email</div>
    <textarea id="details" rows="2" style="width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px;font:inherit;background:#fff" placeholder="Quantities, dates, budget, delivery needs…"></textarea>
    <div style="margin-top:12px"><button class="btn" onclick="draft()">✍️ Draft emails for selected</button></div>` : ""}
  </div>

  <div class="section-label">
    <div class="n">2</div>
    <div><h3>Review &amp; send</h3><small>Edit each draft before it goes out</small></div>
  </div>
  <div class="card">
    ${d.emails.length ? d.emails.map(emailCard).join("") : `<div class="muted">No drafts yet — select suppliers above to generate outreach emails.</div>`}
  </div>

  <div class="section-label">
    <div class="n">3</div>
    <div><h3>Compare &amp; report</h3><small>Chat over replies and get a recommendation</small></div>
  </div>
  <div class="card">
    <div class="chat" id="chat">
      ${(w.chat||[]).length ? (w.chat||[]).map(m => `<div class="msg ${m.role==="user"?"user":"bot"}">${esc(m.content)}</div>`).join("")
        : `<div class="msg bot">Hi! Once you've logged a few supplier replies, ask me to compare them or generate a report. 🌾</div>`}
    </div>
    <div class="chat-input">
      <input id="msg" placeholder="Ask about your emails & replies…" onkeydown="if(event.key==='Enter')send()">
      <button class="btn sm" onclick="send()">Send</button>
    </div>
    <div class="chat-actions">
      <button class="btn wheat sm" onclick="send('Write a short report comparing the companies, their replies, and recommend the best option.')">📊 Generate report</button>
    </div>
  </div>`;
}
function companyRow(c){
  const trust = Number(c.trust_score || c.rating || 0).toFixed(1);
  const reviews = Number(c.review_count || 0).toLocaleString();
  const verified = c.verified ? " · ✓ verified" : "";
  return `<label class="company">
    <input type="checkbox" class="co" value="${c._id}">
    <span class="cinfo"><b>${esc(c.name)}</b><small>📍 ${esc(c.address || c.state)} · ${esc((c.services||[]).join(", "))}</small>
      <small>⭐ ${Number(c.rating || 0).toFixed(1)} · ${reviews} reviews · trust ${trust}/5${verified}</small>
      ${c.review_summary ? `<small>${esc(c.review_summary)}</small>` : ""}
    </span>
    <span class="stars">⭐ ${Number(c.rating || 0).toFixed(1)}</span>
  </label>`;
}
function emailCard(e){
  const st = (e.status||"draft").includes("sent") ? "sent" : "draft";
  return `<div class="email">
    <div class="ehead">
      <div><b>${esc(e.company_name)}</b> <small>&lt;${esc(e.to)}&gt;</small></div>
      <span class="status ${st}">${esc(e.status)}</span>
    </div>
    <div class="field-lbl">Subject</div>
    <input id="s${e._id}" value="${esc(e.subject)}">
    <div class="field-lbl">Body</div>
    <textarea id="b${e._id}" rows="6">${esc(e.body)}</textarea>
    <div class="erow">
      <button class="btn ghost sm" onclick="saveEmail('${e._id}')">💾 Save draft</button>
      <button class="btn sm" onclick="sendEmail('${e._id}')">📨 Approve &amp; send</button>
    </div>
    <div class="field-lbl">Company's reply</div>
    <input id="r${e._id}" value="${esc(e.reply)}" placeholder="Paste the supplier's reply here…">
    <div class="erow"><button class="btn wheat sm" onclick="saveReply('${e._id}')">Save reply</button></div>
  </div>`;
}
const draft = run(async () => {
  const ids = [...document.querySelectorAll(".co:checked")].map(c => c.value);
  if(!ids.length) return toast("Select at least one supplier", true);
  toast("Drafting emails…");
  await api(`/workflows/${wid}/drafts`,"POST",{company_ids:ids, details:$("#details").value});
  renderWorkflow(await api("/workflows/" + wid)); toast("Drafts ready ✍️");
});
const saveEmail = run(async id => {
  await api("/emails/"+id,"PUT",{subject:$("#s"+id).value, body:$("#b"+id).value}); toast("Draft saved 💾");
});
const sendEmail = run(async id => {
  await saveEmail(id);
  const r = await api(`/emails/${id}/send`,"POST");
  toast("Status: " + r.status);
  renderWorkflow(await api("/workflows/" + wid));
});
const saveReply = run(async id => {
  await api(`/emails/${id}/reply`,"POST",{text:$("#r"+id).value}); toast("Reply saved");
});
const send = run(async text => {
  const t = text || $("#msg").value.trim(); if(!t) return;
  if($("#msg")) $("#msg").value = "";
  $("#chat").insertAdjacentHTML("beforeend",
    `<div class="msg user">${esc(t)}</div><div class="msg bot pending">Thinking… 🌾</div>`);
  $("#chat").scrollTop = $("#chat").scrollHeight;
  await api(`/workflows/${wid}/chat`,"POST",{prompt:t});
  renderWorkflow(await api("/workflows/" + wid));
  $("#chat").scrollTop = $("#chat").scrollHeight;
});

/* ================= BOOT ================= */
(run(async () => { token ? await home() : authView(); }))();
</script>
</body>
</html>
