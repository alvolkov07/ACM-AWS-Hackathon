services:
  api:
    # Python API lives in backend/, the HTML front-end in frontend/. The build
    # context is the repo root so the image can include both; the API serves
    # the front-end at / and /static.
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["80:8000"]
    env_file: .env
    # AI settings read by app/config.py and app/ai.py. Values come from .env;
    # the defaults here apply when a value is missing there.
    environment:
      # Provider: USE_BEDROCK=1 uses AWS Bedrock (EC2 IAM role), otherwise the
      # Anthropic API is used when ANTHROPIC_API_KEY is set. With neither,
      # the app runs on rule-based fallbacks.
      USE_BEDROCK: ${USE_BEDROCK:-1}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Model choice: CLAUDE_MODEL overrides everything (required for Bedrock).
      # Otherwise tiers are haiku, sonnet, or opus; CLAUDE_TIER sets both tasks,
      # and the FAST/SMART variables override it per task.
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      CLAUDE_TIER: ${CLAUDE_TIER:-}
      CLAUDE_FAST_TIER: ${CLAUDE_FAST_TIER:-}    # search phrasing, review summaries (default haiku)
      CLAUDE_SMART_TIER: ${CLAUDE_SMART_TIER:-}  # email drafts, chat (default sonnet)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
